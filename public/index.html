<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gamma Portfolio Explorer</title>
  <link rel="icon" type="image/png" href="/imagenes/GammaGris.png" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

  <!-- ── App Layout ──────────────────────────────────────────────────────────── -->
  <div id="app-layout">

    <!-- ── Sidebar (oculto hasta login) ──────────────────────────────────────── -->
    <aside id="app-sidebar" class="hidden">
      <!-- Logo -->
      <div class="sidebar-header">
        <img src="/imagenes/Logo-Gamma-Ingenieros-(Negro).png" alt="Gamma"
             onerror="this.style.display='none'" />
        <div class="sidebar-header-text">
          <span class="sidebar-app-name">Portfolio Explorer</span>
          <span class="sidebar-app-sub">Inteligencia de preventa</span>
        </div>
      </div>

      <!-- Navegación -->
      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Generado dinámicamente por router.js -->
      </nav>

      <!-- Footer: tema + usuario -->
      <div class="sidebar-footer">
        <button class="sidebar-theme-btn" id="theme-toggle" onclick="toggleTheme()">
          <svg class="sidebar-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <span id="theme-label">Modo oscuro</span>
        </button>

        <div class="sidebar-user-row">
          <div class="sidebar-avatar" id="sidebar-avatar">?</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-username"></div>
            <div class="sidebar-user-role" id="sidebar-role"></div>
          </div>
          <button class="sidebar-logout" title="Cerrar sesión" onclick="logout()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- ── Mobile overlay ────────────────────────────────────────────────────── -->
    <div id="sidebar-overlay" class="hidden" onclick="closeSidebar()"></div>

    <!-- ── Main area ─────────────────────────────────────────────────────────── -->
    <div id="app-main" class="no-sidebar">

      <!-- Mobile header -->
      <header id="mobile-header" class="hidden">
        <button class="mobile-menu-btn" onclick="openSidebar()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6"  x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="mobile-header-logo">Portfolio Explorer</span>
      </header>

      <!-- Contenido de página -->
      <div id="page-content"></div>
    </div>

  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- html2pdf for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script type="module">
    import { authState }           from '/js/auth-state.js';
    import { initRouter, navigate } from '/js/router.js';
    import { showToast }            from '/js/components.js';

    // ── Globals ────────────────────────────────────────────────────────────────
    window.navigate = navigate;

    window.logout = () => {
      authState.clear();
      navigate('/login');
      showToast('Sesión cerrada', 'info');
    };

    // ── Sidebar mobile ─────────────────────────────────────────────────────────
    window.openSidebar = () => {
      document.getElementById('app-sidebar').classList.add('open');
      const overlay = document.getElementById('sidebar-overlay');
      overlay.classList.remove('hidden');
      requestAnimationFrame(() => overlay.classList.add('visible'));
    };
    window.closeSidebar = () => {
      document.getElementById('app-sidebar').classList.remove('open');
      const overlay = document.getElementById('sidebar-overlay');
      overlay.classList.remove('visible');
      setTimeout(() => overlay.classList.add('hidden'), 250);
    };

    // ── Dark / Light mode ──────────────────────────────────────────────────────
    const THEME_KEY = 'gamma_theme';

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const label = document.getElementById('theme-label');
      if (label) label.textContent = theme === 'dark' ? 'Modo claro' : 'Modo oscuro';
    }

    window.toggleTheme = () => {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next    = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    };

    // Aplicar tema guardado al cargar
    const savedTheme = localStorage.getItem(THEME_KEY) || 'light';
    applyTheme(savedTheme);

    initRouter();
  </script>
</body>
</html>
